<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Button Callback"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f172a"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter><style>.t{font:700 30px Arial;fill:#0f172a}.l{font:700 19px Arial;fill:#0f172a}.s{font:500 15px Arial;fill:#475569}.c{font:600 15px monospace;fill:#0f172a}</style></defs><rect width="1000" height="520" fill="#f8fafc"/><text x="50" y="60" class="t">05 Buttons: Klick → Callback → Aktion</text><rect x="100" y="115" width="800" height="340" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/><rect x="160" y="210" width="190" height="76" rx="22" fill="#2563eb"/><text x="255" y="257" text-anchor="middle" font="700 21px Arial" fill="#fff">Button</text><rect x="430" y="190" width="220" height="120" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="540" y="230" text-anchor="middle" class="l">onPressed</text><text x="540" y="260" text-anchor="middle" class="s">Callback-Funktion</text><text x="540" y="286" text-anchor="middle" class="c">() { ... }</text><rect x="720" y="210" width="150" height="76" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="795" y="242" text-anchor="middle" class="l">Aktion</text><text x="795" y="267" text-anchor="middle" class="s">läuft</text><line x1="350" y1="248" x2="430" y2="248" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/><line x1="650" y1="248" x2="720" y2="248" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/><text x="255" y="340" text-anchor="middle" class="s">User klickt</text><text x="540" y="340" text-anchor="middle" class="s">Code ist gespeichert</text><text x="795" y="340" text-anchor="middle" class="s">print, Navigation, State</text></svg>